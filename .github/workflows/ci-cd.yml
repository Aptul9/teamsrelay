name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # the page script tests (test/agent/page-*.test.ts) and the relay test (test/local/relay.test.ts) run in the Google
      # Chrome of the runner. The web app, the agent and the supervisor are built and checked by the image build below;
      # here only the bundles no image carries: the local relay and the fleet
      - name: App
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
          node scripts/bundles.mjs relay cmdapi fleet fleet-agent
          node --check public/sw.js
          node dist/relay.cjs --check

      - name: Shell syntax
        run: bash -n deploy/remote-deploy.sh && bash -n deploy/render-env.sh

      - name: Compose files
        env:
          DOMAIN: example.com
        run: |
          docker compose config -q
          docker compose --env-file compose.local.env -f docker-compose.yml -f compose.local.yml config -q

      # the image and the mount of docker-compose.yml, so Dependabot keeps both in step
      - name: Caddyfile
        env:
          DOMAIN: example.com
        run: docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile

      # the browsers image runs node agent.cjs --check and node supervisor.cjs --check while it builds
      - name: Build images
        env:
          DOMAIN: example.com
        run: docker compose build -q webapp browsers

  deploy:
    name: Deploy
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DEPLOY_DOMAIN }}
    # one deploy at a time, never interrupting the running one
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      TR_DIR: /opt/teamsrelay
    steps:
      - uses: actions/checkout@v7

      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # pinned host key: no StrictHostKeyChecking=no
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Backup of the running version
        run: ssh "$TARGET" "test ! -x $TR_DIR/deploy/remote-deploy.sh || $TR_DIR/deploy/remote-deploy.sh backup"

      - name: Upload code
        run: |
          # runtime data (.env, Chromium profiles, databases, VAPID keys, Firebase key) stays on the server
          rsync -az --delete \
            --exclude .git/ --exclude .github/ --exclude .env --exclude node_modules/ --exclude .next/ \
            --exclude /config/ --exclude /data/ --exclude /vapid/ --exclude /fcm/ --exclude .deployed-sha --exclude .caddyfile-sum \
            ./ "$TARGET:$TR_DIR/"

      # .env is rendered from the secrets and variables of the repository (Settings > Secrets and variables > Actions),
      # so a value is changed there and applied by the next deploy; the file on the server is never edited by hand
      - name: Write .env
        env:
          TR_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
          TR_APP_URL: ${{ vars.APP_URL }}
          TR_BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          TR_SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TR_ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          TR_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TR_MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          TR_ACCOUNTS_PER_USER: ${{ vars.ACCOUNTS_PER_USER }}
          TR_DESKTOP_USER: ${{ vars.DESKTOP_USER }}
          TR_DESKTOP_PASS: ${{ secrets.DESKTOP_PASS }}
          TR_DESKTOP_URL: ${{ vars.DESKTOP_URL }}
          TR_VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          TR_TZ: ${{ vars.TZ }}
          TR_HTTPS_PORT: ${{ vars.HTTPS_PORT }}
          TR_HTTPS_BIND: ${{ vars.HTTPS_BIND }}
          TR_NTFY_ENABLED: ${{ vars.NTFY_ENABLED }}
          TR_NTFY_URL: ${{ vars.NTFY_URL }}
          TR_NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: |
          deploy/render-env.sh > /tmp/tr.env
          grep -Eq '^(BETTER_AUTH_SECRET|SESSION_SECRET)=.{32,}' /tmp/tr.env || { echo "no session key of at least 32 characters in the pipeline variables" >&2; exit 1; }
          # previous .env kept outside TR_DIR (rsync --delete and the code rollback do not touch it)
          ssh "$TARGET" "umask 077; test ! -f $TR_DIR/.env || cp -p $TR_DIR/.env /var/tmp/teamsrelay-env.prev"
          ssh "$TARGET" "umask 077; cat > $TR_DIR/.env.new && mv $TR_DIR/.env.new $TR_DIR/.env" < /tmp/tr.env
          rm -f /tmp/tr.env

      - name: Build and restart
        run: ssh "$TARGET" "$TR_DIR/deploy/remote-deploy.sh up ${{ github.sha }}"

      - name: Public HTTPS check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "https://${{ vars.DEPLOY_DOMAIN }}/healthz"; then echo; exit 0; fi
            sleep 6
          done
          echo "https://${{ vars.DEPLOY_DOMAIN }}/healthz does not answer" >&2; exit 1
