name: Android app

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # start page tests run in the Google Chrome of the runner
      - name: Tests
        run: |
          npm ci --no-audit --no-fund
          npm test

      # the runner image carries the Android SDK and NDK; Tauri reads the NDK from NDK_HOME. The launcher icons go
      # into the Android project only once it exists, so they are made again after init.
      - name: Android project
        run: |
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
          NDK_HOME="$ANDROID_NDK_HOME" npx tauri android init --ci --skip-targets-install
          npx tauri icon ../app/public/static/icon-512.png

      # Firebase settings of the app, from the repository secret GOOGLE_SERVICES_JSON (the google-services.json of the
      # Firebase console): string resources of the push plugin. Without the secret the APK receives no notifications.
      - name: Firebase settings
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::secret GOOGLE_SERVICES_JSON not set: the APK receives no notifications"
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          node scripts/firebase-values.mjs "$RUNNER_TEMP/google-services.json" plugin/android/src/main/res/values/google-services.xml

      # One debug key for every run: the repository secret ANDROID_DEBUG_KEYSTORE (base64 of a debug.keystore, alias
      # androiddebugkey, passwords android) goes where the Android Gradle plugin takes its debug key from, so the APK of
      # a later run installs over the app, which keeps its server and session. Without it the build makes a key of its
      # own, and an APK of another run needs the app removed first.
      - name: Signing key
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE" ]; then
            echo "::warning::secret ANDROID_DEBUG_KEYSTORE not set: the APK is signed with a key made for this run"
            exit 0
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE" | base64 -d > "$HOME/.android/debug.keystore"
          sha=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          [ -n "$sha" ] || { echo "::error::ANDROID_DEBUG_KEYSTORE is no keystore with the key androiddebugkey (password android)"; exit 1; }
          echo "DEBUG_KEY_SHA256=$sha" >> "$GITHUB_ENV"

      - name: Build
        run: npx tauri android build --debug --apk --target aarch64

      # the certificate the APK is signed with, which must be the one of the secret when it is set
      - name: Signature
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          got=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "$apk signed by certificate SHA-256 $got"
          if [ -n "$DEBUG_KEY_SHA256" ] && [ "$got" != "$DEBUG_KEY_SHA256" ]; then
            echo "::error::the APK is not signed with the key of ANDROID_DEBUG_KEYSTORE ($DEBUG_KEY_SHA256)"
            exit 1
          fi

      # unit tests of the Kotlin push plugin (it opens what the relay seals), in the Android project of the build
      - name: Plugin tests
        working-directory: mobile/src-tauri/gen/android
        run: ./gradlew --no-daemon :tauri-plugin-push:testDebugUnitTest

      - uses: actions/upload-artifact@v7
        with:
          name: teamsrelay-android-debug
          path: mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
