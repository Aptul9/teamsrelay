version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /agent
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /agent
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /webapp
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /webapp
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
