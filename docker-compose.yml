# TeamsRelay: Docker Compose stack. Configuration in .env (copy .env.example), see docs/setup.md.
#
# Teams account slots: 4, each with its own browser (chromium-N), agent (agent-N) and network (slotN).
# Slots are in the "accounts" profile: "docker compose up -d" does not start them. The deploy creates
# them stopped, and the web app starts the slots that belong to a user (through dockerproxy).
x-chromium: &chromium
  # Remote browser with Microsoft Teams web signed in (the session stays in ./config/N)
  image: lscr.io/linuxserver/chromium:latest@sha256:cf6200ccdcb224feaf5d3bde4ce45b3783c926a7496c98059cae1e0db78e5b2f
  security_opt:
    - seccomp:unconfined
  shm_size: "1gb"
  profiles: ["accounts"]
  restart: unless-stopped

x-chromium-env: &chromium-env
  PUID: "1000"
  PGID: "1000"
  TZ: ${TZ:-UTC}
  CUSTOM_USER: ${DESKTOP_USER:-}
  PASSWORD: ${DESKTOP_PASS:-}
  CHROME_CLI: --remote-debugging-port=9222 --remote-allow-origins=* https://teams.microsoft.com/
  # Without a GPU (ARM VMs) Selkies encodes H.264 in software and the browser decoder gets no frame
  # ("decoder produced no output"): JPEG frames work in every browser and are enough for the login
  SELKIES_ENCODER: jpeg

x-agent: &agent
  # Reads and drives Teams through the Chrome DevTools Protocol, sends the push notifications. Same image as
  # the web app (built by the webapp service), other entrypoint.
  image: teamsrelay
  pull_policy: never
  command: ["node", "agent.cjs"]
  volumes:
    - ./data:/data
    - ./vapid:/vapid:ro
  profiles: ["accounts"]
  restart: unless-stopped

x-agent-env: &agent-env
  TZ: ${TZ:-UTC}
  # 127.0.0.1, not localhost: Chromium binds CDP on IPv4 only, localhost resolves to ::1 first
  CDP: http://127.0.0.1:9222
  APP_DB: /data/app.db
  # the agent stops at start when the private key does not match the public key the devices subscribed with
  VAPID_PRIVATE: /vapid/private_key.pem
  VAPID_APPKEY: /vapid/appkey.txt
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
  NTFY_ENABLED: ${NTFY_ENABLED:-0}
  NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
  NTFY_TOPIC: ${NTFY_TOPIC:-}

services:
  chromium-1:
    <<: *chromium
    container_name: teams-chromium-1
    environment:
      <<: *chromium-env
      # published by Caddy on https://<DOMAIN>/desktop/1/, only to the owner of the slot
      SUBFOLDER: /desktop/1/
    volumes:
      - ./config/1:/config
    networks: [slot1]
  agent-1:
    <<: *agent
    container_name: teams-agent-1
    network_mode: "service:chromium-1"
    depends_on: [chromium-1]
    environment:
      <<: *agent-env
      ACCOUNT: "1"
      DB_PATH: /data/1/messages.db

  chromium-2:
    <<: *chromium
    container_name: teams-chromium-2
    environment:
      <<: *chromium-env
      SUBFOLDER: /desktop/2/
    volumes:
      - ./config/2:/config
    networks: [slot2]
  agent-2:
    <<: *agent
    container_name: teams-agent-2
    network_mode: "service:chromium-2"
    depends_on: [chromium-2]
    environment:
      <<: *agent-env
      ACCOUNT: "2"
      DB_PATH: /data/2/messages.db

  chromium-3:
    <<: *chromium
    container_name: teams-chromium-3
    environment:
      <<: *chromium-env
      SUBFOLDER: /desktop/3/
    volumes:
      - ./config/3:/config
    networks: [slot3]
  agent-3:
    <<: *agent
    container_name: teams-agent-3
    network_mode: "service:chromium-3"
    depends_on: [chromium-3]
    environment:
      <<: *agent-env
      ACCOUNT: "3"
      DB_PATH: /data/3/messages.db

  chromium-4:
    <<: *chromium
    container_name: teams-chromium-4
    environment:
      <<: *chromium-env
      SUBFOLDER: /desktop/4/
    volumes:
      - ./config/4:/config
    networks: [slot4]
  agent-4:
    <<: *agent
    container_name: teams-agent-4
    network_mode: "service:chromium-4"
    depends_on: [chromium-4]
    environment:
      <<: *agent-env
      ACCOUNT: "4"
      DB_PATH: /data/4/messages.db

  webapp:
    # Installable web app (PWA), API and user management; starts and stops the slots of its users
    build: ./app
    image: teamsrelay
    container_name: teams-webapp
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      APP_URL: ${APP_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      # variable of the single-user release, still accepted as the session key
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SLOT_COUNT: ${SLOT_COUNT:-4}
      ACCOUNTS_PER_USER: ${ACCOUNTS_PER_USER:-}
      DESKTOP_URL: ${DESKTOP_URL:-}
      APP_DB: /data/app.db
      CONFIG_DIR: /config
      DOCKER_API: http://dockerproxy:2375
      VAPID_APPKEY: /vapid/appkey.txt
    volumes:
      - ./vapid:/vapid:ro
      - ./data:/data
      # to wipe the browser session of an account when it is removed
      - ./config:/config
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [default, control]
    restart: unless-stopped

  dockerproxy:
    # The web app's only access to Docker: start and stop of the slot containers (teams-chromium-N,
    # teams-agent-N). Every other method and path, other containers included, is refused.
    image: wollomatic/socket-proxy:1.13.1
    container_name: teams-dockerproxy
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -allowfrom=webapp
      - '-allowPOST=(/v1\.[0-9]+)?/containers/teams-(chromium|agent)-[0-9]+/(start|stop)'
      - -allowhealthcheck
      - -shutdowngracetime=5
    # root inside the container only to open the socket (owned by root); no capabilities, read-only
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [control]
    restart: unless-stopped

  caddy:
    # Reverse proxy with automatic HTTPS certificates (Let's Encrypt)
    image: caddy:2.11.4-alpine
    container_name: teams-caddy
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env}
      - HTTPS_PORT=${HTTPS_PORT:-443}
    ports:
      - "80:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [default, slot1, slot2, slot3, slot4]
    restart: unless-stopped

networks:
  # web app and socket proxy only: the browsers, which open web pages, never reach Docker
  control:
    internal: true
  # one network per slot, shared with Caddy only: a browser cannot reach another slot or the web app
  slot1:
  slot2:
  slot3:
  slot4:

volumes:
  caddy_data:
  caddy_config:
