<!-- Controls of a call in progress in Teams web, rebuilt from the selectors of the extension teams-caffeine (selectors.js, 2026-09-18, DOM checked on teams.cloud.microsoft): the microphone button #microphone-button, data-state "mic" (live) or "mic-off" (muted). Not captured on this project's accounts yet; the rest of the bar is only enough for the clicks to land. -->
<div role="toolbar" aria-label="Meeting controls">
  <button id="video-button" aria-label="Camera">Camera</button>
  <button id="microphone-button" data-state="mic" aria-label="Mic">Mic</button>
  <button id="share-button" aria-label="Share">Share</button>
  <button id="hangup-button" aria-label="Leave">Leave</button>
</div>
