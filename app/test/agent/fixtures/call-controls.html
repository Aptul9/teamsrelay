<!-- Controls of a call in progress in Teams web, rebuilt from a probe of slot 2 on 2026-09-29 (1:1 audio call, full screen and minimized to the floating call monitor alike): the toolbar and the microphone button as seen, live state (muted: data-state "mic-off", data-track-action-scenario "callUnmuteAudio", aria-label "Unmute mic"); tracking attributes trimmed, icons emptied, classes left out. The Leave button is invented, for the clicks to have a neighbour. -->
<div data-tid="ubar-toolbar-wrapper">
  <div id="horizontalEnd" data-tid="ubar-horizontal-end" role="toolbar" aria-label="Calling controls">
    <button type="button" data-state="mic-volume-renderer" data-inp="microphone-button" data-iscritical="true" data-track-action-scenario="callMuteAudio" data-track-action-scenario-type="callOrMeetup" data-track-module-name="muteAudioButton" data-track-module-type="muteButton" data-track-panel-type="Ubar" aria-describedby="ubar-tooltip-r1un" aria-label="Mute mic" id="microphone-button" aria-keyshortcuts="Ctrl+Shift+M"><span><div><svg fill="currentColor" aria-hidden="true" width="1em" height="1em" viewBox="0 0 20 20"><path d="" fill="currentColor"></path></svg></div></span><span></span>Mic</button>
    <button type="button" aria-label="Leave">Leave</button>
  </div>
</div>
