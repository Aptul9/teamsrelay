# Local test overlay (Docker Desktop). Not for production.
#   docker compose --env-file compose.local.env -f docker-compose.yml -f compose.local.yml --profile accounts create --build
#   docker compose --env-file compose.local.env -f docker-compose.yml -f compose.local.yml up -d
# App on http://localhost:8090, desktop of account N on http://localhost:8090/desktop/N/.
# Caddy serves plain HTTP: localhost is already a secure context, so the service worker
# and Web Push work without a certificate. No login (NO_AUTH): Caddy listens on 127.0.0.1 only.
# SQLite and the Chromium profiles live in named volumes instead of bind mounts
# on the Windows filesystem, where file locking and symlinks are unreliable.
services:
  chromium-1:
    volumes:
      - tr_config:/config
  chromium-2:
    volumes:
      - tr_config_2:/config
  chromium-3:
    volumes:
      - tr_config_3:/config
  chromium-4:
    volumes:
      - tr_config_4:/config
  agent-1:
    volumes:
      - tr_data:/data
  agent-2:
    volumes:
      - tr_data:/data
  agent-3:
    volumes:
      - tr_data:/data
  agent-4:
    volumes:
      - tr_data:/data
  webapp:
    environment:
      - NO_AUTH=1
    volumes: !override
      - ./webapp/app.py:/app/app.py:ro
      - ./webapp/index.html:/app/index.html:ro
      - ./webapp/login.html:/app/login.html:ro
      - ./webapp/static:/app/static:ro
      - ./vapid:/vapid:ro
      - tr_data:/data
      - tr_config:/config/1
      - tr_config_2:/config/2
      - tr_config_3:/config/3
      - tr_config_4:/config/4
  caddy:
    ports: !override
      - "127.0.0.1:8090:8090"

volumes:
  tr_config:
  tr_config_2:
  tr_config_3:
  tr_config_4:
  tr_data:
