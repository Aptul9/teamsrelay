# Local test overlay (Docker Desktop). Not for production.
#   docker compose --env-file compose.local.env -f docker-compose.yml -f compose.local.yml --profile accounts create --build
#   docker compose --env-file compose.local.env -f docker-compose.yml -f compose.local.yml up -d
# App on http://localhost:8090, sign in with ADMIN_EMAIL / ADMIN_PASSWORD of compose.local.env.
# Caddy serves plain HTTP on 127.0.0.1 only: localhost is already a secure context, so the service
# worker and Web Push work without a certificate.
# SQLite and the Chromium profiles live in named volumes instead of bind mounts on the Windows
# filesystem, where file locking and symlinks are unreliable.
services:
  chromium-1:
    volumes:
      - tr_config:/config
  chromium-2:
    volumes:
      - tr_config_2:/config
  chromium-3:
    volumes:
      - tr_config_3:/config
  chromium-4:
    volumes:
      - tr_config_4:/config
  agent-1:
    volumes:
      - tr_data:/data
  agent-2:
    volumes:
      - tr_data:/data
  agent-3:
    volumes:
      - tr_data:/data
  agent-4:
    volumes:
      - tr_data:/data
  wipe-1:
    volumes:
      - tr_config:/config
  wipe-2:
    volumes:
      - tr_config_2:/config
  wipe-3:
    volumes:
      - tr_config_3:/config
  wipe-4:
    volumes:
      - tr_config_4:/config
  webapp:
    volumes:
      - tr_data:/data
  caddy:
    ports: !override
      - "127.0.0.1:8090:8090"

volumes:
  tr_config:
  tr_config_2:
  tr_config_3:
  tr_config_4:
  tr_data:
